    <text x="495" y="180" font-family="Arial" font-size="12" fill="#7a827b">需求已理解</text>
    <text x="495" y="211" font-family="Arial" font-size="12" fill="#7a827b">已找到 4 个号源</text>
    <text x="495" y="242" font-family="Arial" font-size="12" fill="#7a827b">等待你的确认</text>
    <line x1="495" y1="263" x2="638" y2="263" stroke="#e9e4dc"/>
    <text x="495" y="290" font-family="Arial" font-size="12" fill="#9a9e98">演示数据</text>
    <text x="20" y="420" font-family="Arial" font-size="18" font-weight="700" fill="#2c3b39">D · Warm human service</text>
    <text x="20" y="448" font-family="Arial" font-size="14" fill="#7a8079">更有亲和力，适合患者视角，但要控制装饰避免像营销页</text>
