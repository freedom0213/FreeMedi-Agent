    <text x="48" y="210" font-family="Arial" font-size="13" fill="#56676d">日期</text><text x="48" y="231" font-family="Arial" font-size="14" fill="#21363d">2027-01-16</text>
    <text x="48" y="267" font-family="Arial" font-size="13" fill="#56676d">状态</text><rect x="48" y="281" width="88" height="25" rx="5" fill="#e2f1f1"/><text x="62" y="298" font-family="Arial" font-size="12" fill="#29636a">待患者确认</text>
    <rect x="244" y="86" width="428" height="246" rx="10" fill="#ffffff" stroke="#dbe2e5"/>
    <text x="270" y="120" font-family="Arial" font-size="14" font-weight="700" fill="#2b4148">Agent 工作记录</text>
