    <circle cx="479" cy="210" r="5" fill="#4b83d1"/><text x="494" y="215" font-family="Arial" font-size="12" fill="#5c6470">findAvailableSlots</text>
    <circle cx="479" cy="240" r="5" fill="#43a477"/><text x="494" y="245" font-family="Arial" font-size="12" fill="#5c6470">方案已生成</text>
