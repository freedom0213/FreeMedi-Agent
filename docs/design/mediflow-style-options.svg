    <text x="58" y="244" font-family="Arial" font-size="14" font-weight="700" fill="#4b5750">候选方案</text>
    <text x="58" y="271" font-family="Arial" font-size="13" fill="#68736c">陈医生 · 呼吸内科 · 2027-01-16 09:00</text>
    <rect x="58" y="286" width="112" height="24" rx="12" fill="#d5e7dc"/><text x="75" y="302" font-family="Arial" font-size="12" fill="#3c6b4e">请确认预约</text>
