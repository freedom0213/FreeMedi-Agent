    <circle cx="274" cy="158" r="6" fill="#2d8a91"/><text x="294" y="164" font-family="Arial" font-size="13" fill="#4a5d63">识别预约目标</text>
    <circle cx="274" cy="199" r="6" fill="#2d8a91"/><text x="294" y="205" font-family="Arial" font-size="13" fill="#4a5d63">查询排班与号源</text>
    <circle cx="274" cy="240" r="6" fill="#e5aa4b"/><text x="294" y="246" font-family="Arial" font-size="13" fill="#4a5d63">等待明确确认</text>
