<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420">
  <rect width="1600" height="1370" fill="#f3f5f4"/>
  <text x="64" y="58" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172426">FreeMedi-Agent · 页面布局提案</text>
  <text x="64" y="88" font-family="Arial, sans-serif" font-size="15" fill="#627174">医院就诊服务是主线；Agent 对话服务于预约任务。以下为桌面端结构示意，内容均为演示数据。</text>

  <!-- Patient home -->
  <g transform="translate(64 120)">
    <rect width="1472" height="495" rx="10" fill="#ffffff" stroke="#d9e0df"/>
    <rect width="1472" height="62" rx="10" fill="#ffffff"/>
    <path d="M0 62H1472" stroke="#e6ebea"/>
    <rect x="28" y="17" width="30" height="30" rx="8" fill="#dcefeb"/>
    <path d="M43 23v18M34 32h18" stroke="#1d786f" stroke-width="3" stroke-linecap="round"/>
    <text x="70" y="38" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172426">FreeMedi-Agent</text>
    <text x="340" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#1d786f">首页</text>
    <text x="416" y="38" font-family="Arial, sans-serif" font-size="14" fill="#566568">智能导诊</text>
    <text x="516" y="38" font-family="Arial, sans-serif" font-size="14" fill="#566568">预约挂号</text>
    <text x="616" y="38" font-family="Arial, sans-serif" font-size="14" fill="#566568">我的预约</text>
    <rect x="1290" y="17" width="90" height="28" rx="14" fill="#eef2f1"/>
    <text x="1307" y="36" font-family="Arial, sans-serif" font-size="12" fill="#586568">演示环境</text>
    <circle cx="1410" cy="31" r="16" fill="#e7eceb"/>
    <text x="1403" y="36" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#526160">林</text>

    <text x="72" y="112" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172426">今天想办理什么就诊服务？</text>
    <text x="72" y="140" font-family="Arial, sans-serif" font-size="14" fill="#697779">按科室和日期查号，或告诉我们你的就诊需求。</text>

    <rect x="72" y="164" width="896" height="62" rx="8" fill="#ffffff" stroke="#cfd9d7"/>
    <circle cx="99" cy="194" r="8" fill="none" stroke="#71807f" stroke-width="2"/>
    <path d="M105 200l7 7" stroke="#71807f" stroke-width="2" stroke-linecap="round"/>
    <text x="128" y="199" font-family="Arial, sans-serif" font-size="14" fill="#83908f">搜索科室、医生，或描述就诊需求</text>
    <rect x="816" y="175" width="140" height="40" rx="6" fill="#1d786f"/>
    <text x="850" y="201" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">查询服务</text>

    <rect x="1000" y="164" width="400" height="210" rx="8" fill="#f4f8f7"/>
    <rect x="1024" y="188" width="38" height="38" rx="9" fill="#dcefeb"/>
    <path d="M1034 201h18M1034 208h14M1034 215h10" stroke="#1d786f" stroke-width="2" stroke-linecap="round"/>
    <text x="1076" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172426">智能导诊</text>
    <text x="1024" y="250" font-family="Arial, sans-serif" font-size="13" fill="#617170">不确定挂什么科？描述情况与预约偏好，</text>
    <text x="1024" y="271" font-family="Arial, sans-serif" font-size="13" fill="#617170">Agent 会补充必要信息并查询可选号源。</text>
    <rect x="1024" y="298" width="140" height="42" rx="6" fill="#1d786f"/>
    <text x="1055" y="325" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">开始导诊</text>
    <text x="1180" y="324" font-family="Arial, sans-serif" font-size="12" fill="#6c7978">预约前由你确认</text>

    <text x="72" y="272" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#263536">按科室预约</text>
    <text x="72" y="295" font-family="Arial, sans-serif" font-size="12" fill="#82908e">选择科室后查看医生与可约时间</text>
    <g font-family="Arial, sans-serif" font-size="13" fill="#3e5050">
      <rect x="72" y="312" width="140" height="45" rx="6" fill="#ffffff" stroke="#e1e7e6"/><text x="92" y="340">内科</text><text x="187" y="340" fill="#899492">›</text>
      <rect x="224" y="312" width="140" height="45" rx="6" fill="#ffffff" stroke="#e1e7e6"/><text x="244" y="340">外科</text><text x="339" y="340" fill="#899492">›</text>
      <rect x="376" y="312" width="140" height="45" rx="6" fill="#ffffff" stroke="#e1e7e6"/><text x="396" y="340">妇产科</text><text x="491" y="340" fill="#899492">›</text>
      <rect x="528" y="312" width="140" height="45" rx="6" fill="#ffffff" stroke="#e1e7e6"/><text x="548" y="340">儿科</text><text x="643" y="340" fill="#899492">›</text>
      <rect x="680" y="312" width="140" height="45" rx="6" fill="#ffffff" stroke="#e1e7e6"/><text x="700" y="340">眼科</text><text x="795" y="340" fill="#899492">›</text>
      <rect x="832" y="312" width="136" height="45" rx="6" fill="#ffffff" stroke="#e1e7e6"/><text x="852" y="340">全部科室</text><text x="944" y="340" fill="#899492">›</text>
    </g>

    <path d="M72 399H1400" stroke="#e6ebea"/>
    <text x="72" y="434" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#263536">预约前请留意</text>
    <text x="72" y="462" font-family="Arial, sans-serif" font-size="13" fill="#687775">演示医院 · 预约规则与就诊须知</text>
    <text x="408" y="462" font-family="Arial, sans-serif" font-size="13" fill="#687775">工作日门诊时间 08:00–17:00</text>
    <text x="808" y="462" font-family="Arial, sans-serif" font-size="13" fill="#687775">号源与医生资料均为模拟数据</text>
    <text x="72" y="531" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172426">患者首页</text>
    <text x="205" y="531" font-family="Arial, sans-serif" font-size="13" fill="#687775">先呈现医院服务入口；对话不是首页主视觉。</text>
  </g>

  <!-- Patient agent flow -->
  <g transform="translate(64 680)">
    <rect width="720" height="640" rx="10" fill="#ffffff" stroke="#d9e0df"/>
    <rect width="720" height="56" rx="10" fill="#ffffff"/>
    <path d="M0 56H720" stroke="#e6ebea"/>
    <text x="26" y="35" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172426">智能导诊与预约</text>
    <text x="530" y="35" font-family="Arial, sans-serif" font-size="12" fill="#657371">演示任务 · 进行中</text>

    <rect x="24" y="78" width="672" height="76" rx="7" fill="#f4f7f6"/>
    <text x="44" y="106" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#344545">已收集的预约需求</text>
    <text x="44" y="133" font-family="Arial, sans-serif" font-size="13" fill="#5d6c6a">呼吸内科　·　下周三　·　下午　·　医生不限</text>
    <text x="642" y="108" font-family="Arial, sans-serif" font-size="12" fill="#1d786f">修改</text>

    <text x="32" y="192" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#7a8886">你的需求</text>
    <rect x="192" y="168" width="306" height="54" rx="8" fill="#edf1f0"/>
    <text x="212" y="200" font-family="Arial, sans-serif" font-size="13" fill="#314140">帮我预约下周三下午的呼吸内科。</text>

    <text x="32" y="263" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1d786f">导诊助手</text>
    <text x="32" y="286" font-family="Arial, sans-serif" font-size="12" fill="#71807e">Agent</text>
    <text x="192" y="262" font-family="Arial, sans-serif" font-size="13" fill="#344545">我查到了几个可选时段。请看一下医生和时间，</text>
    <text x="192" y="284" font-family="Arial, sans-serif" font-size="13" fill="#344545">选择合适的方案后再确认预约。</text>

    <path d="M516 168V558" stroke="#e5eae9"/>
    <text x="192" y="323" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#263536">可选预约方案</text>
    <rect x="192" y="339" width="306" height="58" rx="6" fill="#ffffff" stroke="#dce4e2"/>
    <circle cx="215" cy="368" r="8" fill="none" stroke="#83918f" stroke-width="2"/>
    <text x="237" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#314140">陈医生 · 周三 14:00</text>
    <text x="237" y="384" font-family="Arial, sans-serif" font-size="11" fill="#75827f">呼吸内科 · 普通门诊</text>
    <text x="440" y="374" font-family="Arial, sans-serif" font-size="12" fill="#1d786f">选择</text>
    <rect x="192" y="405" width="306" height="58" rx="6" fill="#f2f8f6" stroke="#71a69e"/>
    <circle cx="215" cy="434" r="8" fill="#1d786f"/>
    <circle cx="215" cy="434" r="3" fill="#ffffff"/>
    <text x="237" y="431" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#314140">周医生 · 周三 15:30</text>
    <text x="237" y="450" font-family="Arial, sans-serif" font-size="11" fill="#75827f">呼吸内科 · 普通门诊</text>
    <text x="430" y="440" font-family="Arial, sans-serif" font-size="11" fill="#1d786f">已选择</text>

    <rect x="192" y="480" width="306" height="78" rx="6" fill="#f7f8f7"/>
    <text x="210" y="505" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#394a49">确认前请核对</text>
    <text x="210" y="525" font-family="Arial, sans-serif" font-size="11" fill="#566765">呼吸内科 · 周医生</text>
    <text x="210" y="543" font-family="Arial, sans-serif" font-size="11" fill="#566765">周三 15:30</text>
    <rect x="360" y="522" width="122" height="26" rx="5" fill="#1d786f"/>
    <text x="388" y="540" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff">确认预约</text>

    <text x="536" y="194" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#344545">处理进度</text>
    <text x="536" y="216" font-family="Arial, sans-serif" font-size="10" fill="#8a9694">本次预约任务</text>
    <path d="M543 242V420" stroke="#cbd8d5" stroke-width="2"/>
    <circle cx="543" cy="250" r="5" fill="#1d786f"/>
    <text x="556" y="248" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#40514f">需求已理解</text>
    <text x="556" y="265" font-family="Arial, sans-serif" font-size="9" fill="#7a8785">科室与时段已收集</text>
    <circle cx="543" cy="300" r="5" fill="#1d786f"/>
    <text x="556" y="298" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#40514f">查询可用号源</text>
    <text x="556" y="315" font-family="Arial, sans-serif" font-size="9" fill="#7a8785">findAvailableSlots</text>
    <circle cx="543" cy="350" r="5" fill="#1d786f"/>
    <text x="556" y="348" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#40514f">方案已生成</text>
    <text x="556" y="365" font-family="Arial, sans-serif" font-size="9" fill="#7a8785">找到可选时间</text>
    <circle cx="543" cy="400" r="5" fill="#d1a449"/>
    <text x="556" y="398" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#705b32">等待你确认</text>
    <text x="536" y="454" font-family="Arial, sans-serif" font-size="9" fill="#879391">预约确认后由系统</text>
    <text x="536" y="469" font-family="Arial, sans-serif" font-size="9" fill="#879391">创建并核验结果</text>
    <rect x="24" y="574" width="672" height="42" rx="6" fill="#ffffff" stroke="#dce4e2"/>
    <text x="46" y="600" font-family="Arial, sans-serif" font-size="12" fill="#899492">补充日期、时段偏好，或向助手提问…</text>
    <circle cx="662" cy="595" r="14" fill="#1d786f"/>
    <path d="M655 595h13M663 589l6 6-6 6" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="676" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172426">用户端：智能导诊预约</text>
    <text x="24" y="700" font-family="Arial, sans-serif" font-size="13" fill="#687775">业务方案是主角；对话用于补充条件和解释结果。</text>
  </g>

  <!-- Admin -->
