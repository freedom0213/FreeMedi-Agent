    <g font-family="Arial, sans-serif" font-size="10" fill="#435351">
      <text x="210" y="333">FM-2601048</text><text x="324" y="333">呼吸内科 · 周医生</text><text x="470" y="333">周三 15:30</text><text x="603" y="333" fill="#26704f">已确认</text>
      <text x="210" y="381">FM-2601047</text><text x="324" y="381">心内科 · 赵医生</text><text x="470" y="381">周三 14:00</text><text x="603" y="381" fill="#8b6a28">待确认</text>
      <text x="210" y="429">FM-2601046</text><text x="324" y="429">儿科 · 林医生</text><text x="470" y="429">周四 09:30</text><text x="603" y="429" fill="#26704f">已确认</text>
