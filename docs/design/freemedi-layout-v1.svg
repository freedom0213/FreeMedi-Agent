    <text x="216" y="207" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#263536">18</text>
    <path d="M356 164V212M522 164V212" stroke="#e4e9e8"/>
    <text x="378" y="177" font-family="Arial, sans-serif" font-size="11" fill="#75827f">Agent 完成</text>
    <text x="378" y="207" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#263536">12</text>
    <text x="544" y="177" font-family="Arial, sans-serif" font-size="11" fill="#75827f">待确认</text>
    <text x="544" y="207" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#263536">3</text>

    <text x="198" y="258" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#344545">最近预约</text>
    <rect x="198" y="274" width="496" height="30" fill="#f3f6f5"/>
    <text x="210" y="294" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#687775">预约编号</text>
    <text x="324" y="294" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#687775">科室 / 医生</text>
    <text x="470" y="294" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#687775">就诊时间</text>
    <text x="603" y="294" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#687775">状态</text>
