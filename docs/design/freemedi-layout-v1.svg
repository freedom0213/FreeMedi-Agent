    <text x="60" y="273" font-family="Arial, sans-serif" font-size="11" fill="#334442">演示管理员</text>
    <text x="60" y="291" font-family="Arial, sans-serif" font-size="10" fill="#83908e">本地演示身份</text>

    <text x="198" y="44" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#172426">预约记录</text>
    <text x="198" y="68" font-family="Arial, sans-serif" font-size="11" fill="#71807e">查看模拟预约和 Agent 执行结果</text>
    <rect x="198" y="90" width="496" height="42" rx="5" fill="#ffffff" stroke="#dce4e2"/>
