    <rect x="576" y="97" width="104" height="28" rx="4" fill="#f3f6f5" stroke="#dce4e2"/>
    <text x="590" y="116" font-family="Arial, sans-serif" font-size="11" fill="#526260">全部状态⌄</text>

    <rect x="198" y="150" width="496" height="76" rx="6" fill="#ffffff" stroke="#dce4e2"/>
