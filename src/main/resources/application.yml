spring:
  application:
    name: mediflow-agent
  jackson:
    time-zone: UTC
  datasource:
    url: ${MEDIFLOW_DB_URL:jdbc:mysql://localhost:3306/mediflow?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${MEDIFLOW_DB_USERNAME:mediflow}
    password: ${MEDIFLOW_DB_PASSWORD:mediflow}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  data:
    redis:
      host: ${MEDIFLOW_REDIS_HOST:localhost}
      port: ${MEDIFLOW_REDIS_PORT:6379}
  flyway:
    enabled: ${MEDIFLOW_FLYWAY_ENABLED:false}
    clean-disabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${MEDIFLOW_SERVER_PORT:8080}

mediflow:
  agent:
    max-steps: ${MEDIFLOW_AGENT_MAX_STEPS:8}
    tool-timeout-ms: ${MEDIFLOW_AGENT_TOOL_TIMEOUT_MS:5000}
  llm:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
