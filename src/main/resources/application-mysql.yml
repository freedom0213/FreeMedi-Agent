# Enable explicitly with --spring.profiles.active=mysql against an empty, dedicated schema.
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false

server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
